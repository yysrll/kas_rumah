name: kas_rumah
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  auto_route: ^11.1.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  flutty_solar_icons: ^1.0.4
  fpdart: ^1.2.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  intl: ^0.20.2
  shadcn_ui: ^0.46.2
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.12.0
  syncfusion_flutter_charts: ^32.2.7
  year_month_picker: ^1.0.3

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.11.1
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1
  lean_builder: ^0.1.7

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)

  # line_length: 80 # Optional
  # Optional
  integrations:
    image: true
    flutter_svg: true
    rive: false
    lottie: false

  assets:
    enabled: true # Optional
    outputs: # Optional
      # Set to true if you want this package to be a package dependency
      # See: https://flutter.dev/docs/development/ui/assets-and-images#from-packages
      package_parameter_enabled: false # Optional
      # Available values:
      # - camel-case
      # - snake-case
      # - dot-delimiter
      style: dot-delimiter # Optional
      class_name: AppAsset
    exclude: []

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
